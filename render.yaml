# Render Blueprint — deploy the live dashboard from GitHub in one click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nse-bse-screener
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
